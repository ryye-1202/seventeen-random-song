<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEVENTEEN — Random Track</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 15%, rgba(111,167,246,0.85), transparent 35%),
      radial-gradient(circle at 80% 85%, rgba(255,120,220,0.35), transparent 35%),
      #e6e6fc;
    color: #1b1b2b;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 0;
  }

  .container {
    width: 90%;
    max-width: 500px;
    text-align: center;
    padding: 40px 25px;
  }

  .small-title { font-size: 11px; letter-spacing: 5px; opacity: 0.5; margin-bottom: 18px; }

  h1 {
    font-size: clamp(42px, 12vw, 72px);
    letter-spacing: -3px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .subtitle { font-size: 12px; letter-spacing: 4px; opacity: 0.45; margin-bottom: 45px; }

  /* ---------- VINILO ---------- */

  .disc-wrap {
    margin: 0 auto 35px;
    width: 190px;
    height: 190px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .disc {
    position: relative;
    width: 190px;
    height: 190px;
    border-radius: 50%;

    /* vinilo rosa/azul pastel (colores oficiales SEVENTEEN: Rose Quartz & Serenity)
       con surcos concéntricos simulados */
    background:
      repeating-radial-gradient(
        circle at center,
        rgba(0,0,0,0.16) 0px,
        rgba(0,0,0,0.16) 1px,
        transparent 2px,
        transparent 5px
      ),
      conic-gradient(
        from 0deg,
        #f7b8c6, #f9c9d6, #b8d4f7, #a9c8f5, #f7b8c6
      );

    box-shadow:
      0 0 0 1px rgba(255,255,255,0.4),
      0 12px 35px rgba(90,70,150,0.35),
      inset 0 0 25px rgba(255,255,255,0.25);

    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* brillo tipo reflejo de vinilo */
  .disc::before {
    content: "";
    position: absolute;
    top: 8%;
    left: 12%;
    width: 35%;
    height: 20%;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    filter: blur(6px);
    transform: rotate(-25deg);
    pointer-events: none;
  }

  /* etiqueta central */
  .disc-label {
    position: relative;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #ffe3ec 55%, #dcebff 100%);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.6), 0 2px 6px rgba(0,0,0,0.15);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 8px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #a86b8a;
    text-align: center;
    line-height: 1.2;
  }

  .disc-label span { display: block; font-size: 14px; }

  /* agujero central */
  .disc-label::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: #e6e6fc;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
  }

  .disc.spinning { animation: spin 1.1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* --------------------------- */

  .question { font-size: 12px; letter-spacing: 3px; opacity: 0.45; margin-bottom: 15px; }

  #song {
    min-height: 70px;
    font-size: clamp(25px, 7vw, 38px);
    letter-spacing: -1px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease;
  }

  #artist { min-height: 20px; margin-top: 8px; font-size: 11px; letter-spacing: 2px; opacity: 0.5; }

  button {
    margin-top: 32px;
    border: 1px solid rgba(27,27,43,0.25);
    background: rgba(255,255,255,0.35);
    color: #1b1b2b;
    padding: 15px 28px;
    border-radius: 100px;
    font-size: 11px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
  }

  button:hover { background: rgba(255,255,255,0.7); border-color: rgba(27,27,43,0.5); transform: translateY(-2px); }
  button:active { transform: scale(0.96); }

  #spotify {
    display: none;
    margin-top: 22px;
    background: #1DB954;
    color: #fff;
    text-decoration: none;
    padding: 13px 26px;
    border-radius: 100px;
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: bold;
  }

  #spotify:hover { background: #17a449; }

  .footer { margin-top: 55px; font-size: 9px; letter-spacing: 2px; opacity: 0.3; }
</style>
</head>

<body>

<main class="container">

  <div class="small-title">SAY THE NAME</div>
  <h1>SEVENTEEN</h1>
  <div class="subtitle">RANDOM SONG TRACK</div>

  <div class="disc-wrap">
    <div class="disc" id="disc">
      <div class="disc-label"><span>17</span>CARAT</div>
    </div>
  </div>

  <div class="question">YOUR SONG IS...</div>

  <div id="song">🎲</div>
  <div id="artist"></div>

  <button onclick="randomSong()">SHUFFLE</button>

  <br>

  <a id="spotify" href="#" target="_blank" rel="noopener">▶ ESCUCHAR EN SPOTIFY</a>

  <div class="footer">13 MEMBERS · 1 RANDOM SONG</div>

</main>

<script>

/*
   Cada canción tiene:
     name   -> el título que se muestra
     artist -> quién la canta
     id     -> el ID de Spotify de ESA canción exacta

   Para sacar el id de una canción nueva:
   Spotify > la canción > Compartir > Copiar enlace.
   Te da algo como:
   https://open.spotify.com/track/6oeMntjclWLoguzwj5ECTo?si=xxxxx
   El id es lo que va después de /track/ y antes de "?" :
   6oeMntjclWLoguzwj5ECTo
*/

const songs = [
  { name: "SUPER",                    artist: "SEVENTEEN", id: "3AOf6YEpxQ894FmrwI9k96" },
  { name: "MAESTRO",                  artist: "SEVENTEEN", id: "2UE9XGbAzicJIyo4bB6sqM" },
  { name: "SOS",                      artist: "SEVENTEEN", id: "3oTDi9MWC0JB39FcsLRon3" },
  { name: "THUNDER",                  artist: "SEVENTEEN", id: "6oeMntjclWLoguzwj5ECTo" },
  { name: "GOD OF MUSIC",             artist: "SEVENTEEN", id: "2n3SF8cvMgaCVizKRJRUJW" },
  { name: "God of Music (Trot Ver.)", artist: "SEVENTEEN", id: "6h13gMfEDlVlXFb8iDVaXb" },
  { name: "VERY NICE",                artist: "SEVENTEEN", id: "1Rrj7KyS2R6SP9CQMDJW1w" },
  { name: "MANSAE",                   artist: "SEVENTEEN", id: "5rIsrawNyPv1q8v11iwJsh" },
  { name: "FIGHTING",                 artist: "BSS",       id: "7eBpUuPnDTfbeP1P4P93CS" },
  { name: "CBZ (PRIME TIME)",         artist: "BSS",       id: "0ofqcEBPdlyczRjUhjCiIS" },
  { name: "DON QUIXOTE",              artist: "SEVENTEEN", id: "7BiEgR5r0yMmFoWC9kOTGf" },
  { name: "CHEERS",                   artist: "SEVENTEEN", id: "1pdFdv8R6ezIAUUNkn785b" },
  { name: "CLAP",                     artist: "SEVENTEEN", id: "19t5GSN3XsLB7UOsZD8Fwv" },
  { name: "_WORLD",                   artist: "SEVENTEEN", id: "3cp89olzCHiS76TdI4rGTR" },
  { name: "HIT",                      artist: "SEVENTEEN", id: "0uIw1c0E2nyFWWwEVzhl30" },
  { name: "HOT",                      artist: "SEVENTEEN", id: "6I2tqFhk8tq69iursYxuxd" },
  { name: "RAT RACE",                 artist: "V8",        id: "3cHzq4HX4ijdisuJ0a8SEj" },
  { name: "SINGASONG",                artist: "V8",        id: "1uDVTuH0e2XaMPsX3yox1T" },
  { name: "GIRLSNBOYS",               artist: "V8",        id: "0Jnh3156FyIz7SHWgKHRmp" },
  { name: "FIESTA",                   artist: "CxM",       id: "0ANyGUmVsiCjLQWhAuCl9Q" },
  { name: "WORTH IT",                 artist: "CxM",       id: "04f4d0aG5ckrLifRzlv93z" },
  { name: "5, 4, 3 (Pretty woman)",   artist: "CxM",       id: "4eTDkRxOmm4llv4Yr1bteq" },
  { name: "PARTY ROCK ROCK",          artist: "Picheolin", id: "5wsPiyVi6oIHY0RAz8Ay0G" },
  { name: "MI-CHEO MI-CHEO",          artist: "Picheolin", id: "594CTGIIVVTitwRhQJcWgM" },
  { name: "PRETTY U",                 artist: "SEVENTEEN", id: "6FaIMrCu7bxblZdt1Tfsjn" },
  { name: "HOME;RUN",                 artist: "SEVENTEEN", id: "4w25m2448QReLEsiuqhpLt" },
  { name: "WATER",                    artist: "SEVENTEEN", id: "1DQGGkXu9SIwWiK5uuBvcO" },

  { name: "LEFT & RIGHT",             artist: "SEVENTEEN", id: "5QGooKayQPVZMUDc8Qt3Dm" },
  { name: "CALL CALL CALL!",          artist: "SEVENTEEN", id: "469YeZRBzZw8AnNQvG5GRS" },
  { name: "ADORE U",                  artist: "SEVENTEEN", id: "6wtgR5ZVbOZPHIeMNQwugp" },
  { name: "ROCK WITH YOU",            artist: "SEVENTEEN", id: "6LnEoRQKMcaFTR5UvaKuBy" },
  { name: "HEY BUDDY",                artist: "SEVENTEEN", id: "1hd8IgMElWy3OqcFVjZMUx" },
  { name: "TO YOU",                   artist: "SEVENTEEN", id: "25osmdhvjltPlN7gI2Javd" }
];


let lastSong = null;
let isShuffling = false;


function spotifyUrl(song) {
  if (song.id) {
    return "https://open.spotify.com/track/" + song.id;
  }
  return "https://open.spotify.com/search/" +
         encodeURIComponent(song.name + " " + song.artist);
}


function randomSong() {

  if (isShuffling) return;
  isShuffling = true;

  const disc    = document.getElementById("disc");
  const songEl  = document.getElementById("song");
  const artEl   = document.getElementById("artist");
  const linkEl  = document.getElementById("spotify");

  disc.classList.add("spinning");
  linkEl.style.display = "none";

  let selected;
  do {
    selected = songs[Math.floor(Math.random() * songs.length)];
  } while (songs.length > 1 && selected.name === lastSong);

  lastSong = selected.name;

  // animación de barajado
  const shuffleInterval = setInterval(() => {
    const fake = songs[Math.floor(Math.random() * songs.length)];
    songEl.style.opacity = "0";
    setTimeout(() => {
      songEl.textContent = fake.name;
      artEl.textContent  = fake.artist;
      songEl.style.opacity = "1";
    }, 80);
  }, 130);

  // parar y mostrar la elegida
  setTimeout(() => {
    clearInterval(shuffleInterval);
    songEl.style.opacity = "0";

    setTimeout(() => {
      songEl.textContent = selected.name;
      artEl.textContent  = selected.artist;
      songEl.style.opacity = "1";

      disc.classList.remove("spinning");

      linkEl.href = spotifyUrl(selected);
      linkEl.style.display = "inline-block";

      isShuffling = false;
    }, 150);

  }, 1500);
}

</script>

</body>
</html>
