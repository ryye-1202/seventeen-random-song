<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f5f2">

<title>A little something for you ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
    --rose: #f7cac9;
    --rose-soft: #f9dfdf;
    --serenity: #91a8d0;
    --blue-soft: #dce5f3;
    --cream: #faf8f5;
    --ink: #5b5265;
    --ink-soft: #827889;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;

    font-family: "Manrope", sans-serif;
    color: var(--ink);

    background:
        radial-gradient(
            circle at 12% 15%,
            rgba(247, 202, 201, 0.48),
            transparent 31%
        ),
        radial-gradient(
            circle at 88% 20%,
            rgba(145, 168, 208, 0.35),
            transparent 32%
        ),
        radial-gradient(
            circle at 55% 90%,
            rgba(247, 202, 201, 0.25),
            transparent 35%
        ),
        var(--cream);
}

/* =========================================================
   INTRO SCREEN
========================================================= */

.intro-screen {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 20px;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(247, 202, 201, 0.42),
            transparent 32%
        ),
        radial-gradient(
            circle at 80% 75%,
            rgba(145, 168, 208, 0.35),
            transparent 35%
        ),
        #fbf9f6;

    transition:
        opacity 0.9s ease,
        visibility 0.9s ease;
}

.intro-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-content {
    width: min(500px, 100%);
    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;

    animation: introAppear 1.1s ease both;
}

.intro-small {
    margin-bottom: 7px;

    font-family: "Caveat", cursive;
    font-size: clamp(25px, 6vw, 34px);
    font-weight: 500;

    color: #817485;
}

.intro-main {
    margin: 0;

    font-family: "Manrope", sans-serif;
    font-size: clamp(13px, 3.5vw, 15px);
    letter-spacing: 0.18em;
    text-transform: uppercase;

    color: #776c7e;
}

.intro-sub {
    margin-top: 12px;
    margin-bottom: 32px;

    font-family: "Caveat", cursive;
    font-size: clamp(20px, 5vw, 25px);

    color: #918494;
}

.intro-cd-wrapper {
    position: relative;

    width: min(290px, 68vw);
    aspect-ratio: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    touch-action: manipulation;
}

.intro-cd-wrapper::before {
    content: "";

    position: absolute;
    inset: 8%;

    border-radius: 50%;

    background: rgba(247, 202, 201, 0.22);

    filter: blur(28px);
}

.intro-cd {
    position: relative;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(255,255,255,0.95) 0 3%,
            transparent 11%
        ),
        conic-gradient(
            from 10deg,
            #f7cac9,
            #f2e2ea,
            #b9c9e3,
            #e8d9ec,
            #f7cac9,
            #d9e6ef,
            #f6d5d5,
            #c6d6ec,
            #f7cac9
        );

    box-shadow:
        0 22px 50px rgba(91, 82, 101, 0.16),
        inset 0 0 25px rgba(255,255,255,0.65),
        inset 0 0 3px rgba(91,82,101,0.22);

    transition:
        transform 0.45s ease,
        box-shadow 0.45s ease;
}

.intro-cd::before {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:
        repeating-radial-gradient(
            circle at center,
            transparent 0px,
            transparent 7px,
            rgba(255,255,255,0.18) 8px,
            transparent 10px
        );

    opacity: 0.72;
}

.intro-cd::after {
    content: "";

    position: absolute;
    inset: 7%;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.75) 0%,
            rgba(255,255,255,0.05) 25%,
            transparent 40%,
            rgba(255,255,255,0.35) 72%,
            transparent 100%
        );

    mix-blend-mode: screen;
}

.cd-center {
    position: absolute;
    left: 50%;
    top: 50%;

    width: 23%;
    aspect-ratio: 1;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #faf8f5 0 20%,
            rgba(255,255,255,0.9) 21% 34%,
            rgba(100,90,110,0.22) 35% 37%,
            transparent 38%
        );

    box-shadow:
        0 1px 3px rgba(91,82,101,0.18),
        inset 0 0 4px rgba(255,255,255,0.8);

    z-index: 4;
}

.cd-label {
    position: absolute;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-family: "Caveat", cursive;
    font-size: clamp(22px, 6vw, 31px);

    color: rgba(91,82,101,0.74);

    z-index: 3;

    pointer-events: none;
}

.intro-cd-wrapper:hover .intro-cd {
    transform: scale(1.035) rotate(4deg);

    box-shadow:
        0 28px 60px rgba(91, 82, 101, 0.2),
        inset 0 0 25px rgba(255,255,255,0.7);
}

.intro-hint {
    margin-top: 30px;

    font-family: "Caveat", cursive;
    font-size: clamp(22px, 5.5vw, 27px);

    color: #817485;

    animation: softPulse 2.2s ease-in-out infinite;
}

.intro-detail {
    margin-top: 5px;

    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;

    color: #a29aa7;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding:
        max(35px, env(safe-area-inset-top))
        20px
        max(35px, env(safe-area-inset-bottom));

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
}

.main.visible {
    opacity: 1;
    visibility: visible;
}

.card {
    width: min(520px, 100%);

    text-align: center;
}

.eyebrow {
    margin-bottom: 4px;

    font-family: "Caveat", cursive;
    font-size: clamp(22px, 5vw, 27px);

    color: #8b7d8f;
}

.title {
    margin: 0;

    font-size: clamp(11px, 3vw, 13px);
    font-weight: 600;

    letter-spacing: 0.24em;
    text-transform: uppercase;

    color: #75697b;
}

.cd-area {
    position: relative;

    width: min(315px, 73vw);
    aspect-ratio: 1;

    margin: 28px auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.cd {
    position: relative;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 32% 27%,
            rgba(255,255,255,0.96) 0 3%,
            transparent 13%
        ),
        conic-gradient(
            from 15deg,
            #f7cac9 0deg,
            #eaddea 45deg,
            #aebfdf 90deg,
            #f3dce4 140deg,
            #f7cac9 180deg,
            #d3e2ed 220deg,
            #e6d7e9 265deg,
            #f3cfd3 315deg,
            #f7cac9 360deg
        );

    box-shadow:
        0 24px 55px rgba(91,82,101,0.18),
        inset 0 0 30px rgba(255,255,255,0.62),
        inset 0 0 3px rgba(91,82,101,0.25);

    transition: transform 0.5s ease;
}

.cd::before {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:
        repeating-radial-gradient(
            circle at center,
            transparent 0,
            transparent 7px,
            rgba(255,255,255,0.18) 8px,
            transparent 10px
        );

    opacity: 0.8;
}

.cd::after {
    content: "";

    position: absolute;
    inset: 6%;

    border-radius: 50%;

    background:
        linear-gradient(
            130deg,
            rgba(255,255,255,0.8),
            transparent 21%,
            transparent 44%,
            rgba(255,255,255,0.28) 62%,
            transparent 72%
        );

    mix-blend-mode: screen;
}

.cd-shine {
    position: absolute;
    inset: 10%;

    border-radius: 50%;

    background:
        linear-gradient(
            45deg,
            transparent 35%,
            rgba(255,255,255,0.42) 49%,
            transparent 60%
        );

    z-index: 3;

    pointer-events: none;
}

.cd-hole {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 22%;
    aspect-ratio: 1;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #faf8f5 0 20%,
            rgba(255,255,255,0.94) 21% 33%,
            rgba(91,82,101,0.18) 34% 37%,
            transparent 38%
        );

    box-shadow:
        inset 0 0 4px rgba(91,82,101,0.18);

    z-index: 5;
}

.cd-text {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 4;

    font-family: "Caveat", cursive;
    font-size: clamp(23px, 6vw, 31px);

    color: rgba(91,82,101,0.72);

    pointer-events: none;
}

.result-label {
    margin-bottom: 8px;

    font-family: "Caveat", cursive;
    font-size: clamp(22px, 5vw, 27px);

    color: #8c7d90;
}

.song-name {
    min-height: 72px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0 10px;

    font-size: clamp(25px, 7vw, 37px);
    line-height: 1.1;
    font-weight: 600;

    color: #665b70;

    letter-spacing: -0.025em;
}

.song-name.shuffle {
    animation: songShuffle 0.16s linear infinite alternate;
}

.shuffle-button {
    margin-top: 18px;

    min-height: 50px;
    min-width: 190px;

    padding: 12px 24px;

    border: 1px solid rgba(117,105,123,0.2);
    border-radius: 999px;

    background:
        linear-gradient(
            135deg,
            rgba(247,202,201,0.42),
            rgba(145,168,208,0.32)
        );

    color: #655a6f;

    font-family: "Manrope", sans-serif;
    font-size: 12px;
    font-weight: 700;

    letter-spacing: 0.12em;
    text-transform: uppercase;

    cursor: pointer;

    box-shadow:
        0 8px 20px rgba(91,82,101,0.08);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;

    touch-action: manipulation;
}

.shuffle-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 12px 25px rgba(91,82,101,0.13);
}

.shuffle-button:active {
    transform: scale(0.97);
}

.spotify-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;

    width: min(270px, 88vw);
    min-height: 50px;

    margin: 13px auto 0;

    padding: 12px 22px;

    border-radius: 999px;

    background: #6d6276;

    color: white;

    text-decoration: none;

    font-size: 11px;
    font-weight: 700;

    letter-spacing: 0.13em;
    text-transform: uppercase;

    box-shadow:
        0 10px 24px rgba(91,82,101,0.15);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;

    touch-action: manipulation;
}

.spotify-button:hover {
    transform: translateY(-2px);

    background: #62576b;

    box-shadow:
        0 14px 28px rgba(91,82,101,0.2);
}

.spotify-button:active {
    transform: scale(0.97);
}

.spotify-icon {
    width: 18px;
    height: 18px;

    display: block;
}

.preview-area {
    margin-top: 17px;

    min-height: 26px;
}

.preview-button {
    display: none;

    align-items: center;
    justify-content: center;
    gap: 7px;

    border: none;
    background: transparent;

    color: #877a8c;

    font-family: "Caveat", cursive;
    font-size: 21px;

    cursor: pointer;

    touch-action: manipulation;
}

.preview-button.visible {
    display: inline-flex;
}

.preview-note {
    display: none;

    margin-top: 5px;

    font-size: 9px;
    letter-spacing: 0.08em;

    color: #a49aa8;
}

.preview-note.visible {
    display: block;
}

.footer {
    margin-top: 32px;

    font-family: "Caveat", cursive;
    font-size: 18px;

    color: #9b8d9e;
}

/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes introAppear {
    from {
        opacity: 0;
        transform: translateY(16px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes softPulse {
    0%, 100% {
        opacity: 0.65;
    }

    50% {
        opacity: 1;
    }
}

@keyframes songShuffle {
    from {
        opacity: 0.35;
        transform: translateY(-2px);
    }

    to {
        opacity: 0.85;
        transform: translateY(2px);
    }
}

.cd.spinning {
    animation: spinCD 1.75s cubic-bezier(.4,0,.2,1);
}

@keyframes spinCD {
    from {
        transform: rotate(0deg) scale(1);
    }

    50% {
        transform: rotate(180deg) scale(1.04);
    }

    to {
        transform: rotate(360deg) scale(1);
    }
}

.intro-cd.opening {
    animation: openingCD 1.75s ease;
}

@keyframes openingCD {
    0% {
        transform: scale(1) rotate(0);
    }

    50% {
        transform: scale(1.06) rotate(180deg);
    }

    100% {
        transform: scale(1) rotate(360deg);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 480px) {

    .intro-screen {
        padding-left: 18px;
        padding-right: 18px;
    }

    .intro-sub {
        margin-bottom: 25px;
    }

    .intro-cd-wrapper {
        width: min(255px, 68vw);
    }

    .intro-hint {
        margin-top: 24px;
    }

    .cd-area {
        width: min(275px, 70vw);
        margin-top: 22px;
        margin-bottom: 22px;
    }

    .song-name {
        min-height: 62px;
        font-size: clamp(24px, 8vw, 32px);
    }

    .shuffle-button,
    .spotify-button {
        min-height: 52px;
    }

    .footer {
        margin-top: 25px;
    }
}

@media (max-height: 700px) {

    .intro-cd-wrapper {
        width: min(220px, 53vh);
    }

    .intro-sub {
        margin-bottom: 18px;
    }

    .intro-hint {
        margin-top: 18px;
    }

    .cd-area {
        width: min(240px, 52vh);
        margin-top: 17px;
        margin-bottom: 16px;
    }

    .footer {
        margin-top: 20px;
    }
}

</style>
</head>

/*
==========================================================
ELEMENTS
==========================================================
*/

const introScreen = document.getElementById("introScreen");
const introCD = document.getElementById("introCD");

const main = document.getElementById("main");

const cd = document.getElementById("cd");

const songName = document.getElementById("songName");

const shuffleButton = document.getElementById("shuffleButton");

const spotifyButton = document.getElementById("spotifyButton");

const previewButton = document.getElementById("previewButton");
const previewIcon = document.getElementById("previewIcon");
const previewText = document.getElementById("previewText");
const previewNote = document.getElementById("previewNote");


let currentSong = null;
let currentAudio = null;
let isPlayingPreview = false;


/*
==========================================================
OPEN GIFT
==========================================================
*/

function openGift() {

    if (introCD.classList.contains("opening")) {
        return;
    }

    introCD.classList.add("opening");

    setTimeout(() => {

        introScreen.classList.add("hidden");

        main.classList.add("visible");

        setTimeout(() => {
            chooseSong();
        }, 500);

    }, 700);
}


/*
==========================================================
RANDOM SONG
==========================================================
*/

function chooseSong() {

    stopPreview();

    shuffleButton.disabled = true;

    songName.classList.add("shuffle");

    cd.classList.remove("spinning");

    /*
    Force browser reflow so animation can restart.
    */
    void cd.offsetWidth;

    cd.classList.add("spinning");


    /*
    Pick random song.
    */

    let randomIndex;

    do {
        randomIndex = Math.floor(Math.random() * songs.length);
    }

    while (
        songs.length > 1 &&
        songs[randomIndex] === currentSong
    );


    currentSong = songs[randomIndex];


    /*
    Small shuffle animation.
    */

    let counter = 0;

    const shuffleInterval = setInterval(() => {

        const temporary =
            songs[
                Math.floor(
                    Math.random() * songs.length
                )
            ];

        songName.textContent = temporary.title;

        counter++;

        if (counter >= 10) {

            clearInterval(shuffleInterval);

            songName.textContent = currentSong.title;

            songName.classList.remove("shuffle");

            updateSpotifyButton();

            updatePreview();

            shuffleButton.disabled = false;
        }

    }, 85);
}


/*
==========================================================
SPOTIFY BUTTON
==========================================================
*/

function updateSpotifyButton() {

    if (!currentSong) {
        return;
    }

    spotifyButton.href = currentSong.spotify;
}


/*
==========================================================
PREVIEW
==========================================================
*/

function updatePreview() {

    /*
    Remove old preview.
    */

    stopPreview();

    previewButton.classList.remove("visible");
    previewNote.classList.remove("visible");

    previewText.textContent = "play preview";
    previewIcon.textContent = "▶";


    /*
    If this particular song has a preview URL,
    create an audio element.

    Spotify may return null / unavailable previews,
    so this condition is intentionally optional.
    */

    if (
        currentSong &&
        currentSong.preview &&
        currentSong.preview.trim() !== ""
    ) {

        currentAudio = new Audio(currentSong.preview);

        currentAudio.preload = "auto";

        currentAudio.volume = 0.75;

        currentAudio.addEventListener(
            "ended",
            () => {

                isPlayingPreview = false;

                previewIcon.textContent = "▶";
                previewText.textContent = "play preview";

            }
        );

        currentAudio.addEventListener(
            "error",
            () => {

                stopPreview();

                previewButton.classList.remove("visible");
                previewNote.classList.remove("visible");

            }
        );


        previewButton.classList.add("visible");

        previewNote.classList.add("visible");


        /*
        Try autoplay.

        Mobile browsers may block autoplay.
        If blocked, the preview button remains available
        so the user can start it manually.
        */

        currentAudio
            .play()
            .then(() => {

                isPlayingPreview = true;

                previewIcon.textContent = "Ⅱ";
                previewText.textContent = "pause preview";

            })
            .catch(() => {

                isPlayingPreview = false;

                previewIcon.textContent = "▶";
                previewText.textContent = "play preview";

            });

    }
}


/*
==========================================================
PLAY / PAUSE PREVIEW
==========================================================
*/

function togglePreview() {

    if (!currentAudio) {
        return;
    }


    if (isPlayingPreview) {

        currentAudio.pause();

        isPlayingPreview = false;

        previewIcon.textContent = "▶";
        previewText.textContent = "play preview";

    }

    else {

        currentAudio
            .play()
            .then(() => {

                isPlayingPreview = true;

                previewIcon.textContent = "Ⅱ";
                previewText.textContent = "pause preview";

            })
            .catch(() => {

                isPlayingPreview = false;

                previewIcon.textContent = "▶";
                previewText.textContent = "play preview";

            });

    }
}


/*
==========================================================
STOP PREVIEW
==========================================================
*/

function stopPreview() {

    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio.src = "";

        currentAudio = null;
    }

    isPlayingPreview = false;
}


/*
==========================================================
KEYBOARD SUPPORT
==========================================================
*/

document.addEventListener("keydown", function(event) {

    if (
        event.key === "Enter" &&
        !introScreen.classList.contains("hidden")
    ) {

        openGift();

    }

});


/*
==========================================================
INITIAL STATE
==========================================================
*/

spotifyButton.href = "#";

</script>
