================================================== */

.intro-disc {

    height:
        215px;

    position:
        relative;

    border-radius:
        50%;

    cursor:

            rgba(255,255,255,0.75) 2%,

        rgba(255,255,255,0.70),

    transition:
        transform 0.5s ease,
        box-shadow 0.5s ease;

}


/* ==================================================
   CD RINGS
================================================== */

.intro-disc::before,
.main-disc::before {

    content:
        "";

    position:
        absolute;

    inset:
        7px;

    border-radius:
        50%;

    background:

        repeating-radial-gradient(
            circle,

            transparent 0px,
            transparent 8px,

            rgba(255,255,255,0.25) 9px,

            transparent 10px

        overlay;

}


/* ==================================================
   CD REFLECTION
================================================== */

.intro-disc::after,
.main-disc::after {

    content:
        "";

    position:
        absolute;

    inset:
        7px;

    border-radius:
        50%;

    background:

        linear-gradient(
            125deg,

            transparent 15%,

            rgba(255,255,255,0.80) 25%,

            rgba(255,255,255,0.15) 33%,

            rgba(255,255,255,0.55) 74%,

            transparent 83%

    opacity:
        0.75;

/* ==================================================
   CD CENTRE
================================================== */

.disc-centre {

    position:
        absolute;

    width:
        26px;

    height:
        26px;

    left:
        50%;

    top:
        50%;

    transform:
        translate(-50%, -50%);

    border-radius:
        50%;

    background:

            #ffffff,

    border:

    box-shadow:

        0 0 0 1px

    color:

    animation:
        gentlePulse 2s ease-in-out infinite;

    }

    50% {

    50% {

================================================== */

function openGift() {


    if (giftOpened) {

        return;

    }


    giftOpened = true;


    const intro =
        document.getElementById("intro");


    const introDisc =
        document.getElementById("introDisc");


    const main =
        document.getElementById("main");


    introDisc.classList.add(
        "opening"
    );


    setTimeout(() => {


        intro.classList.add(
            "hidden"
        );


        main.classList.add(
            "visible"
        );


    }, 650);

}

        document.getElementById("artist");


    const spotifyElement =
        document.getElementById("spotify");


    disc.classList.add(
        "spinning"
    );


    spotifyElement.style.display =
        "none";


    let randomIndex;

    let selectedSong;


    do {


        randomIndex =
            Math.floor(
                Math.random()
                *
                songs.length
            );


        selectedSong =
            songs[randomIndex];


    }

    while (

        songs.length > 1 &&

        selectedSong.name
        ===
        lastSong

    );


    lastSong =
        selectedSong.name;



    /* ==============================================
       SHUFFLE ANIMATION
    ============================================== */


    const shuffleInterval =

        setInterval(() => {


            const fakeSong =

                songs[
                    Math.floor(
                        Math.random()
                        *
                        songs.length
                    )
                ];


            songElement.style.opacity =
                "0";


            setTimeout(() => {


                songElement.textContent =
                    fakeSong.name;


                artistElement.textContent =
                    fakeSong.artist;


                songElement.style.opacity =
                    "1";


            }, 80);


        }, 130);



    /* ==============================================
       STOP
    ============================================== */


    setTimeout(() => {


        clearInterval(
            shuffleInterval
        );


        songElement.style.opacity =
            "0";


        setTimeout(() => {


            songElement.textContent =
                selectedSong.name;


            artistElement.textContent =
                selectedSong.artist;


            songElement.style.opacity =
                "1";


            disc.classList.remove(
                "spinning"
            );


            spotifyElement.href =
                selectedSong.url;


            spotifyElement.style.display =
                "inline-block";


        }, 150);


    }, 1500);

}


</script>


</body>

</html>
