/* =====================================================
   COLOURS
   ===================================================== */

:root {

    --rose: #e9a7bd;

    --rose-light: #f4c9d8;

    --serenity: #8eb5d3;

    --serenity-light: #b8d0e3;

    --lavender: #b5a8d8;

    --cream: #fff8f5;

    --dark-blue: #242d48;

    --deep: #171a2d;

/* =====================================================
   GENERAL
   ===================================================== */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


body {

    color: var(--cream);

    font-family:

        sans-serif;


    background:

        radial-gradient(

            rgba(233,167,189,0.45),

        radial-gradient(
            circle at 88% 18%,
            rgba(142,181,211,0.42),
            transparent 32%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(181,168,216,0.30),
            transparent 42%
        ),

        linear-gradient(
            135deg,
            #353c5d,
            #252c48 45%,
            #20243b
        );


    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    position: relative;

}


/* subtle paper/light texture */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.08;

    background-image:

        radial-gradient(
            rgba(255,255,255,0.8) 0.6px,
            transparent 0.6px
        );

    background-size: 5px 5px;

}


/* =====================================================
   MAIN CONTAINER
   ===================================================== */

.container {

    width: 90%;

    max-width: 520px;

    text-align: center;

    padding: 40px 25px;

    position: relative;

    z-index: 2;

}


/* =====================================================
   SMALL HANDWRITTEN TEXT
   ===================================================== */

.small-title {

    font-family:
        "Caveat",
        cursive;

    font-size: 25px;

    font-weight: 500;

    letter-spacing: 1px;

    color: var(--rose-light);

    margin-bottom: 5px;

    transform: rotate(-2deg);

}


/* =====================================================
   MAIN TITLE
   ===================================================== */

h1 {

    font-family:
        "Manrope",
        sans-serif;

    font-size:
        clamp(45px, 13vw, 78px);

    line-height: 0.95;

    letter-spacing: -4px;

    font-weight: 800;

    color: white;

    margin-bottom: 10px;

}


/* =====================================================
   SUBTITLE
   ===================================================== */

.subtitle {

    font-family:
        "Caveat",
        cursive;

    font-size: 24px;

    letter-spacing: 2px;

    color: var(--serenity-light);

    margin-bottom: 45px;

}


/* =====================================================
   CD
   ===================================================== */

.disc {

    width: 190px;

    height: 190px;

    margin: 0 auto 42px;

    border-radius: 50%;

    position: relative;

    background:

        radial-gradient(
            circle at 48% 45%,
            rgba(255,255,255,0.95) 0%,
            rgba(255,255,255,0.55) 2%,
            transparent 3%
        ),

        conic-gradient(
            from 0deg,

            #d8a7bb,
            #a9c5d9,
            #e4d4a8,
            #a8c3df,
            #d8a7c7,
            #e8c7a8,
            #9ebbd8,
            #d9a8bd,
            #d8a7bb
        );


    box-shadow:

        inset
        0 0 0 1px
        rgba(255,255,255,0.65),

        inset
        0 0 25px
        rgba(255,255,255,0.45),

        0 12px 45px
        rgba(10,15,35,0.35),

        0 0 50px
        rgba(233,167,189,0.22);


    display: flex;

    justify-content: center;

    align-items: center;

    transition:
        transform 0.15s ease;

}


/* CD radial lines */

.disc::before {

    content: "";

    position: absolute;

    inset: 7px;

    border-radius: 50%;

    background:

        repeating-radial-gradient(
            circle,
            transparent 0px,
            transparent 9px,
            rgba(255,255,255,0.12) 10px,
            transparent 11px
        );

    mix-blend-mode: overlay;

}


/* CD reflection */

.disc::after {

    content: "";

    position: absolute;

    inset: 8px;

    border-radius: 50%;

    background:

        linear-gradient(
            125deg,
            transparent 15%,
            rgba(255,255,255,0.65) 25%,
            rgba(255,255,255,0.08) 32%,
            transparent 42%,
            transparent 68%,
            rgba(255,255,255,0.45) 75%,
            transparent 82%
        );

    opacity: 0.75;

}


/* centre hole */

.disc {

    isolation: isolate;

}


.disc .center {

    width: 20px;

    height: 20px;

    border-radius: 50%;

    background: #555a70;

    border: 3px solid rgba(255,255,255,0.7);

    box-shadow:
        inset 0 0 6px rgba(0,0,0,0.4);

    z-index: 5;

}


.disc.spinning {

    animation:
        spin 0.55s linear infinite;

}


@keyframes spin {

    from {

        transform:
            rotate(0deg);

    }

    to {

        transform:
            rotate(360deg);

    }

}


/* =====================================================
   QUESTION
   ===================================================== */

.question {

    font-family:

        cursive;

    letter-spacing: 1px;

/* =====================================================
   BUTTON
   ===================================================== */

button {

    margin-top: 30px;

    border:
        1px solid

    background:

        linear-gradient(
            135deg,
            rgba(233,167,189,0.28),
            rgba(142,181,211,0.22)

    color: white;

    padding: 14px 32px;

    border-radius: 100px;

    font-family:
        "Manrope",
        sans-serif;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 3px;

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(10,15,35,0.15);

    transition:

        transform 0.2s ease,

        background 0.2s ease,

        box-shadow 0.2s ease;
}


button:hover {

    background:

        linear-gradient(
            135deg,
            rgba(233,167,189,0.45),
            rgba(142,181,211,0.38)

    transform:
        translateY(-2px);

    box-shadow:
        0 12px 30px rgba(10,15,35,0.22);

}


button:active {

    transform:
        scale(0.96);

}


/* =====================================================
   SPOTIFY
   ===================================================== */

        "Caveat",

    font-size: 21px;

    letter-spacing: 1px;

    transition:
        opacity 0.2s ease,

        transform 0.2s ease;
}


#spotify:hover {

    transform:

/* =====================================================
   FOOTER

/* =====================================================

    }

let lastSong = null;



/* =====================================================
   RANDOM SONG
   ===================================================== */

function randomSong() {


    const disc =
        document.getElementById("disc");


    const songElement =
        document.getElementById("song");


    const artistElement =
        document.getElementById("artist");


    const spotifyElement =
        document.getElementById("spotify");


    disc.classList.add("spinning");


    spotifyElement.style.display =
        "none";


    let randomIndex;

    let selectedSong;


    do {

        randomIndex =
            Math.floor(
                Math.random() *
                songs.length
            );

        selectedSong =
            songs[randomIndex];

    }

    while (

        songs.length > 1 &&

        selectedSong.name ===
        lastSong

    );


    lastSong =
        selectedSong.name;



    /* =================================================
       SHUFFLE ANIMATION
       ================================================= */

    const shuffleInterval =

        setInterval(() => {


            const fakeSong =

                songs[
                    Math.floor(
                        Math.random() *
                        songs.length
                    )
                ];


            songElement.style.opacity =
                "0";


            setTimeout(() => {


                songElement.textContent =
                    fakeSong.name;


                artistElement.textContent =
                    fakeSong.artist;


                songElement.style.opacity =
                    "1";


            }, 80);


        }, 130);



    /* =================================================
       FINAL RESULT
       ================================================= */

    setTimeout(() => {


        clearInterval(
            shuffleInterval
        );


        songElement.style.opacity =
            "0";


        setTimeout(() => {


            songElement.textContent =
                selectedSong.name;


            artistElement.textContent =
                selectedSong.artist;


            songElement.style.opacity =
                "1";


            disc.classList.remove(
                "spinning"
            );


            spotifyElement.href =
                selectedSong.url;


            spotifyElement.style.display =
                "inline-block";


        }, 150);


    }, 1500);

}
