<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SEVENTEEN — Random Track</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(120, 90, 255, 0.18),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(255, 120, 220, 0.12),
                    transparent 30%
                ),

                #08080c;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }


        .container {

            width: 90%;

            max-width: 500px;

            text-align: center;

            padding: 45px 25px;
        }


        .small-title {

            font-size: 11px;

            letter-spacing: 5px;

            opacity: 0.55;

            margin-bottom: 18px;
        }


        h1 {

            font-size:
                clamp(42px, 12vw, 72px);

            letter-spacing: -3px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .subtitle {

            font-size: 12px;

            letter-spacing: 4px;

            opacity: 0.5;

            margin-bottom: 55px;
        }


        .disc {

            width: 170px;

            height: 170px;

            margin: 0 auto 40px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,

                    #111 0%,
                    #111 8%,

                    #272733 9%,

                    #101017 18%,

                    #1b1b24 35%,

                    #08080c 70%
                );


            box-shadow:

                0 0 0 1px
                rgba(255,255,255,0.15),

                0 0 60px
                rgba(150,120,255,0.15);


            display: flex;

            justify-content: center;

            align-items: center;


            transition:
                transform 0.15s ease;
        }


        .disc::after {

            content: "";

            width: 13px;

            height: 13px;

            background: #08080c;

            border-radius: 50%;

            box-shadow:

                0 0 0 2px
                rgba(255,255,255,0.15);
        }


        .disc.spinning {

            animation:
                spin 0.55s linear infinite;
        }


        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        .question {

            font-size: 12px;

            letter-spacing: 3px;

            opacity: 0.45;

            margin-bottom: 15px;
        }


        #song {

            min-height: 70px;

            font-size:
                clamp(25px, 7vw, 38px);

            letter-spacing: -1px;

            font-weight: 600;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                opacity 0.2s ease;
        }


        #artist {

            min-height: 20px;

            margin-top: 8px;

            font-size: 11px;

            letter-spacing: 2px;

            opacity: 0.45;
        }


        button {

            margin-top: 35px;

            border:
                1px solid
                rgba(255,255,255,0.25);

            background:
                rgba(255,255,255,0.04);

            color: white;

            padding: 15px 28px;

            border-radius: 100px;

            font-size: 11px;

            letter-spacing: 3px;

            cursor: pointer;

            transition:

                background 0.2s ease,

                transform 0.2s ease,

                border-color 0.2s ease;
        }


        button:hover {

            background:
                rgba(255,255,255,0.1);

            border-color:
                rgba(255,255,255,0.5);

            transform:
                translateY(-2px);
        }


        button:active {

            transform:
                scale(0.96);
        }


        #spotify {

            display: none;

            margin-top: 25px;

            color: white;

            text-decoration: none;

            font-size: 10px;

            letter-spacing: 2px;

            opacity: 0.7;

            transition:
                opacity 0.2s ease;
        }


        #spotify:hover {

            opacity: 1;
        }


        .footer {

            margin-top: 60px;

            font-size: 9px;

            letter-spacing: 2px;

            opacity: 0.25;
        }


    </style>

</head>


<body>


<main class="container">


    <div class="small-title">

        A LITTLE SOMETHING

    </div>


    <h1>

        SEVENTEEN

    </h1>


    <div class="subtitle">

        RANDOM TRACK

    </div>


    <div
        class="disc"
        id="disc"
    ></div>


    <div class="question">

        YOUR SONG IS...

    </div>


    <div id="song">

        🎲

    </div>


    <div id="artist"></div>


    <button
        onclick="randomSong()"
    >

        SHUFFLE

    </button>


    <br>


    <a
        id="spotify"
        href="#"
        target="_blank"
    >

        ▶ LISTEN ON SPOTIFY

    </a>


    <div class="footer">

        34 POSSIBILITIES · 1 RANDOM SONG

    </div>


</main>



<script>


/* =====================================================
   SONG LIST
   ===================================================== */


const songs = [


    {
        name: "SUPER",

    },


    {
        name: "MAESTRO",
        artist: "SEVENTEEN"
    },


    {
        name: "SOS",
        artist: "SEVENTEEN"
    },


    {
        name: "THUNDER",

    },


    {
        name: "God of Music (Trot Remix)",
        artist: "SEVENTEEN"
    },


    {
        name: "VERY NICE",
        artist: "SEVENTEEN"
    },


    {
        name: "MANSAE",
        artist: "SEVENTEEN"
    },


    {
        name: "FIGHTING",
        artist: "BSS"
    },


    {
        name: "DON QUIXOTE",
        artist: "SEVENTEEN"
    },


    {
        name: "CHEERS",
        artist: "SEVENTEEN"
    },


    {
        name: "CLAP",
        artist: "SEVENTEEN"
    },


    {
        name: "_WORLD",
        artist: "SEVENTEEN"
    },


    {
        name: "HIT",
        artist: "SEVENTEEN"
    },


    {
        name: "rat race",
        artist: "THE 8, Vernon"
    },


    {
        name: "singasong",
        artist: "THE 8, Vernon"
    },


    {
        name: "girlsnboys",
        artist: "THE 8, Vernon"
    },


    {
        name: "Fiesta",

    },


    {
        name: "Worth it",
        artist: "CxM"
    },


    {
        name: "Party Rock Rock",
        artist: "Picheolin"
    },


    {
        name: "Mi-cheo Mi-cheo",
        artist: "Picheolin"
    },


    {
        name: "PRETTY U",
        artist: "SEVENTEEN"
    },


    {
        name: "HOME;RUN",
        artist: "SEVENTEEN"
    },


    {
        name: "GOD OF MUSIC",
        artist: "SEVENTEEN"
    },


    {
        name: "HOT",

    },


    {

        artist: "BSS"

    },

    },


    {

        artist: "SEVENTEEN"

        artist: "SEVENTEEN"
    },

        artist: "SEVENTEEN"
    },


    {
        name: "5, 4, 3 (Pretty woman) (feat. Lay Bankz)",
        artist: "CxM"
    }


];



/* =====================================================
   PREVIOUS SONG
   ===================================================== */


let lastSong = null;



/* =====================================================
   RANDOM SONG FUNCTION
   ===================================================== */


function randomSong() {


    const disc =
        document.getElementById("disc");


    const songElement =
        document.getElementById("song");


    const artistElement =
        document.getElementById("artist");


    const spotifyElement =
        document.getElementById("spotify");


    /*
       Start disc animation
    */


    disc.classList.add("spinning");


    /*
       Hide Spotify button
    */


    spotifyElement.style.display =
        "none";


    /*
       Select a random song
       but don't repeat the previous one
    */


    let randomIndex;

    let selectedSong;


    do {


        randomIndex =
            Math.floor(
                Math.random()
                *
                songs.length
            );


        selectedSong =
            songs[randomIndex];


    }

    while (

        songs.length > 1 &&

        selectedSong.name
        ===
        lastSong

    );


    lastSong =
        selectedSong.name;



    /* =================================================
       SHUFFLE ANIMATION
       ================================================= */


    let counter = 0;


    const shuffleInterval =

        setInterval(() => {


            const fakeSong =

                songs[
                    Math.floor(
                        Math.random()
                        *
                        songs.length
                    )
                ];


            songElement.style.opacity =
                "0";


            setTimeout(() => {


                songElement.textContent =
                    fakeSong.name;


                artistElement.textContent =
                    fakeSong.artist;


                songElement.style.opacity =
                    "1";


            }, 80);


            counter++;


        }, 130);



    /* =================================================
       STOP SHUFFLING
       ================================================= */


    setTimeout(() => {


        clearInterval(
            shuffleInterval
        );


        songElement.style.opacity =
            "0";


        setTimeout(() => {


            /*
               Show final song
            */


            songElement.textContent =
                selectedSong.name;


            artistElement.textContent =
                selectedSong.artist;


            songElement.style.opacity =
                "1";


            /*
               Stop disc
            */


            disc.classList.remove(
                "spinning"
            );



            /* =========================================
               SPOTIFY LINK
               ========================================= */


            const spotifySearch =

                "https://open.spotify.com/search/"
                +

                encodeURIComponent(

                    selectedSong.name
                    +
                    " "
                    +
                    selectedSong.artist

                );


            spotifyElement.href =
                spotifySearch;


            spotifyElement.style.display =
                "inline-block";


        }, 150);


    }, 1500);


}


</script>


</body>

</html>
